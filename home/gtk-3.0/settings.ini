[Settings]
# Match qt6ct's icon_theme so GTK and Qt applications draw the same icons.
# There was no settings.ini here at all, so GTK had no icon theme set and fell
# back to whatever was compiled in — the same missing-icon problem Qt had.
gtk-icon-theme-name=Flat-Remix-Blue-Dark
gtk-cursor-theme-name=Bibata-Modern-Classic
gtk-application-prefer-dark-theme=1
