# Hypridle
# Original config submitted by https://github.com/SherLock707

$iDIR="$HOME/.config/swaync/images/ja.png"

general {
    lock_cmd = pidof hyprlock || ~/.config/hypr/scripts/hyprlock.sh # runs hyprlock if it is not already running (this is always run when "loginctl lock-session" is called) 
    unlock_cmd = killall -q hyprlock # kills hyprlock when unlocking (this is always run when "loginctl unlock-session" is called)
    before_sleep_cmd = loginctl lock-session    # ensures that the session is locked before going to sleep
    after_sleep_cmd = hyprctl dispatch dpms on # turn of screen after sleep (not strictly necessary, but just in case)
    ignore_dbus_inhibit = false             # whether to ignore dbus-sent idle-inhibit requests (used by e.g. firefox or steam)
}

# turn off screen faster if session is already locked
listener {
    timeout = 30                            # 30 seconds
    on-timeout = pidof hyprlock && hyprctl dispatch dpms off # turns off the screen if hyprlock is active
    on-resume = pidof hyprlock && hyprctl dispatch dpms on    # command to run when activity is detected after timeout has fired.
}

# ── Removed: video screensaver listener ───────────────────────────────────────
# It ran scripts/screensaver.sh on a 60s timeout. That script is deleted, as is
# scripts/ToggleScreensaver.sh, which flipped this block on and off by sed-ing
# `#SCREENSAVER_DISABLED# ` prefixes in and out of this file.
#
# That toggle could not have worked here anyway: ~/.config/hypr/configs is a
# read-only Home Manager symlink into /nix/store, so its `sed -i` had nothing
# writable to edit. It was also never bound to a key.
#
# The prefixes it left behind arrived doubled ("#SCREENSAVER_DISABLED# #SCREEN…")
# and had bled past the screensaver block onto the two listeners below, which is
# why they are commented out. The screensaver's own `listener {` line was left
# UNPREFIXED while its body and closing brace were commented, so this file has
# been carrying an unclosed block since the first commit.

