[mgr]
show_hidden = true
show_symlink = true
sort_by = "natural"
sort_dir_first = true

[preview]
tab_size = 2
max_width = 1200
max_height = 900

[opener]
edit = [
    { run = 'nvim "$@"', desc = "Edit in neovim", block = true },
]
open = [
    { run = 'xdg-open "$@"', desc = "Open with default app" },
]

[open]
rules = [
    { mime = "text/*", use = "edit" },
    { mime = "application/json", use = "edit" },
    { mime = "application/toml", use = "edit" },
    { mime = "inode/x-empty", use = "edit" },
    { mime = "*", use = "open" },
]
