# RT5682 (unprefixed controls) + MAX98357A speaker amp on Geminilake
#
# NOTE: on this card the rt5682 codec controls carry no "rt5682 " name
# prefix, so /codecs/rt5682/init.conf cannot be reused verbatim.

LibraryConfig.remap.Config {

	ctl.default.remap {
		"name='STO1 ADC Boost Gain Volume'" "name='STO1 ADC Boost Capture Volume'"
	}

}

BootSequence [
	# Speaker (MAX98357A) off until a device is enabled
	cset "name='Spk Switch' off"

	# Headphone output off until a device is enabled
	cset "name='Headphone Jack Switch' off"
	cset "name='HPOL Playback Switch' 0"
	cset "name='HPOR Playback Switch' 0"

	# Playback routing: DAC1 -> stereo DAC mixer -> HPO
	cset "name='Stereo1 DAC MIXL DAC L1 Switch' 1"
	cset "name='Stereo1 DAC MIXR DAC R1 Switch' 1"
	cset "name='DAC1 MIXL DAC1 Switch' 1"
	cset "name='DAC1 MIXR DAC1 Switch' 1"
	cset "name='DAC L Mux' 1"
	cset "name='DAC R Mux' 1"

	# Capture defaults
	cset "name='Headset Mic Switch' off"
	cset "name='STO1 ADC Capture Switch' on"
	cset "name='RECMIX1L CBJ Switch' 1"
	cset "name='CBJ Boost Volume' 3"
	cset "name='Stereo1 ADC L Mux' 0"
	cset "name='Stereo1 ADC R Mux' 0"
	cset "name='IF1 01 ADC Swap Mux' 2"
	cset "name='Stereo1 ADC L1 Mux' 1"
	cset "name='Stereo1 ADC R1 Mux' 1"
	cset "name='Stereo1 ADC MIXL ADC1 Switch' 0"
	cset "name='Stereo1 ADC MIXR ADC1 Switch' 0"
	cset "name='Stereo1 ADC MIXL ADC2 Switch' 0"
	cset "name='Stereo1 ADC MIXR ADC2 Switch' 0"
]
